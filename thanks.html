<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Message Sent — Smooth Tony</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0a0c; --text: #f0ece4; --muted: #9a958c; --gold: #d4a853; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }
    h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.5rem, 6vw, 3.5rem); letter-spacing: 0.04em; margin-bottom: 1rem; }
    p { color: var(--muted); max-width: 420px; line-height: 1.7; margin-bottom: 2rem; }
    a {
      display: inline-block;
      background: var(--gold);
      color: #0a0a0c;
      font-weight: 600;
      padding: 0.85rem 1.75rem;
      border-radius: 4px;
      text-decoration: none;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Message received.</h1>
    <p>I'll get back to you within 24–48 hours about your project. Check your inbox for a reply.</p>
    <a href="index.html">Back to site</a>
  </main>
</body>
</html>
